services:
    bim2sim:
        image: eliasmpjunior/bim2sim:latest
        platform: linux/amd64
        build:
            context: ../
            dockerfile: ./docker-compose/manifests/Dockerfile
        container_name: bim2sim
        hostname: bim2sim
        volumes:
            - ../projects:/projects
            - ../bim2sim:/tmp/build/lib/bim2sim
        ports:
        - "${PORT:-8081}:8000"
        environment:
            - TZ=America/Sao_Paulo
        networks:
            - brasidata
        command:
            - bash
            - -c
            - |
                tail -f /dev/null
            # cd /projects/en/log && python -m http.server 8000

networks:
  brasidata:
    external: true
